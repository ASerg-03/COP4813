            <h2>Assignment 5: Spirograph</h2>

            <p>
                This assignment uses HTML5 Canvas and JavaScript to create
                an interactive Spirograph.
            </p>
            
            
            <div class="spirograph-controls">

                <label for="radiusR">Outer Radius (R):</label>
                <input type="number" id="radiusR" value="150" min="1" step="1">

                <label for="radiusR2">Inner Radius (r):</label>
                <input type="number" id="radiusR2" value="50" min="1" step="1">

                <label for="offsetO">Pen Offset (O):</label>
                <input type="number" id="offsetO" value="25" min="0">

                <button id="startButton">Start Spirograph</button>

                <button id="stopButton">Stop</button>

            </div>


            <canvas id="spirographCanvas" width="800" height="600"></canvas>
